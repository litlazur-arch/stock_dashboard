<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가족 주식 대시보드</title>

  <!-- 1. Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. 모듈화된 커스텀 스타일시트 -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-[#0b1120] text-slate-100 antialiased p-2 sm:p-6 min-h-screen flex justify-center items-start">

  <!-- 메인 모바일 카드 뷰 컨테이너 -->
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col my-2">
    
    <!-- 최상단 상태바 & 사용자(Ⓙ/Ⓚ) 전환기 -->
    <header class="bg-slate-950 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="statusDot"></span>
        <span class="text-xs font-mono text-slate-400" id="urlDisplay">https://.../u/j</span>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- 새로고침 버튼 -->
        <button onclick="window.DashboardApp.loadData()" class="p-1 rounded-md text-slate-400 hover:text-white hover:bg-slate-800 transition-all" title="새로고침">
          <svg class="w-3.5 h-3.5" id="refreshIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>

        <!-- 사용자 전환 토글 (URL 분리 시뮬레이터) -->
        <div class="flex bg-slate-900 p-0.5 rounded-lg border border-slate-800 text-xs">
          <button id="btnUserJ" onclick="window.DashboardApp.setUser('j')" class="px-2.5 py-1 rounded-md font-medium transition-all bg-blue-600 text-white shadow-xs">
            내 계좌 (Ⓙ)
          </button>
          <button id="btnUserK" onclick="window.DashboardApp.setUser('k')" class="px-2.5 py-1 rounded-md font-medium transition-all text-slate-400 hover:text-white">
            배우자 (Ⓚ)
          </button>
        </div>
      </div>
    </header>

    <!-- 대시보드 타이틀 및 총 자산 요약 헤더 -->
    <section class="px-5 pt-4 pb-2">
      <div class="flex items-center justify-between">
        <div>
          <span class="text-xs font-medium text-slate-400 tracking-wide uppercase" id="userTitleLabel">내 포트폴리오 (Ⓙ)</span>
          <h1 class="text-xl font-bold text-white flex items-center gap-1.5" id="currentAccountTitle">
            통합
          </h1>
        </div>
        <div class="text-right">
          <div class="text-xs text-slate-400">총 평가 자산</div>
          <div class="text-lg font-extrabold text-white tracking-tight font-mono" id="headerTotalAsset">
            - 원
          </div>
        </div>
      </div>
    </section>

    <!-- 계좌 선택 탭 바 (모바일 가로 스크롤) -->
    <nav class="px-4 py-2 border-b border-slate-800">
      <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="accountTabsContainer">
        <!-- js/ui.js에서 동적 생성 -->
      </div>
    </nav>

    <!-- 데이터 로딩 스피너 -->
    <div id="loadingBox" class="p-12 flex flex-col items-center justify-center space-y-3">
      <div class="w-8 h-8 border-3 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs text-slate-400">Google Sheets 실시간 데이터 동기화 중...</p>
    </div>

    <!-- 대시보드 메인 콘텐츠 영역 -->
    <main id="mainContent" class="p-4 space-y-5 overflow-y-auto hidden">

      <!-- 1단: 최근 12개월 총 자산 막대그래프 -->
      <article class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-2 h-4 rounded-full bg-blue-500"></div>
            <h2 class="text-sm font-semibold text-white">최근 12개월 총 자산</h2>
          </div>
          <span class="text-xs text-blue-400 font-semibold" id="assetGrowthLabel">-</span>
        </div>
        <div class="h-36 w-full relative">
          <svg class="w-full h-full overflow-visible" id="assetBarChartSvg"></svg>
        </div>
        <div class="flex justify-between items-center text-xs text-slate-400 mt-2 pt-2 border-t border-slate-800">
          <span>최저: <strong class="text-white" id="assetMinVal">-</strong></span>
          <span>최고: <strong class="text-white" id="assetMaxVal">-</strong></span>
        </div>
      </article>

      <!-- 2단: 동일 기간 배당금 수령액 막대그래프 -->
      <article class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-2 h-4 rounded-full bg-amber-500"></div>
            <h2 class="text-sm font-semibold text-white">동일 기간 배당금 수령액</h2>
          </div>
          <span class="text-xs font-semibold text-amber-400" id="latestDividendLabel">-</span>
        </div>
        <div class="h-28 w-full relative">
          <svg class="w-full h-full overflow-visible" id="dividendBarChartSvg"></svg>
        </div>
        <div class="flex justify-between items-center text-xs text-slate-400 mt-2 pt-2 border-t border-slate-800">
          <span>연간 누적 배당: <strong class="text-amber-400 font-bold" id="totalDividendYear">-</strong></span>
          <span>월평균: <strong class="text-white" id="avgDividendMonth">-</strong></span>
        </div>
      </article>

      <!-- 3단: 보유 종목 비율 트리맵 (Treemap) -->
      <article class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-2 h-4 rounded-full bg-indigo-500"></div>
            <h2 class="text-sm font-semibold text-white">보유 종목 비율 (트리맵)</h2>
          </div>
          <span class="text-xs text-slate-400" id="stockCountBadge">0개 종목</span>
        </div>
        
        <!-- 트리맵 인터랙티브 영역 -->
        <div class="w-full h-56 relative overflow-hidden bg-slate-950 border border-slate-800 select-none" id="ratioTreemapContainer">
        </div>

        <!-- 안내 캡션 -->
        <div class="flex items-center justify-between text-[11px] text-slate-400 mt-2.5 px-0.5">
          <span>💡 타일 터치 시 하단 종목 카드로 이동</span>
          <span class="text-indigo-400 font-medium">면적 = 평가액 비중</span>
        </div>
      </article>

      <!-- 4단: 보유 종목 상세 리스트 카드 -->
      <article class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-2 h-4 rounded-full bg-emerald-500"></div>
            <h2 class="text-sm font-semibold text-white">보유 종목 상세 리스트</h2>
          </div>
          <span class="text-xs text-slate-400">평가액 기준</span>
        </div>

        <div class="space-y-2.5" id="stockListContainer">
        </div>
      </article>

    </main>

    <!-- 하단 푸터 -->
    <footer class="bg-slate-950 border-t border-slate-800 px-4 py-2.5 text-center text-xs text-slate-400 flex justify-between items-center">
      <span id="lastUpdatedTime">실시간 연동</span>
      <span class="font-medium text-slate-200">Google Sheets SPI2</span>
    </footer>

  </div>

  <!-- 3. 모듈화된 자바스크립트 로드 순서 -->
  <script src="./js/api.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
