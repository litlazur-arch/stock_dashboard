<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Trending Chart Graphic -->
  <g transform="translate(64, 74)">
    <!-- Grid line hints -->
    <line x1="20" y1="280" x2="364" y2="280" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />
    <line x1="20" y1="180" x2="364" y2="180" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />
    <line x1="20" y1="80" x2="364" y2="80" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />

    <!-- Growth Bars -->
    <rect x="40" y="210" width="44" height="90" rx="10" fill="#1e293b" />
    <rect x="110" y="150" width="44" height="150" rx="10" fill="#334155" />
    <rect x="180" y="190" width="44" height="110" rx="10" fill="#475569" />
    <rect x="250" y="100" width="44" height="200" rx="10" fill="url(#primaryGrad)" />
    <rect x="320" y="40" width="44" height="260" rx="10" fill="url(#accentGrad)" filter="url(#glow)" />

    <!-- Trend Arrow Line -->
    <path d="M 40 230 Q 140 180, 200 190 T 342 35" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <circle cx="342" cy="35" r="9" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Currency / Dividend Emblem -->
  <circle cx="256" cy="406" r="42" fill="#0f172a" stroke="#3b82f6" stroke-width="4" />
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="900" fill="#60a5fa" text-anchor="middle">₩</text>
</svg>
