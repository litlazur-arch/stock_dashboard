<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPI2 Dashboard</title>

  <!-- PWA & 모바일 웹 앱 설정 (홈 화면 추가 시 전체화면 구동) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SPI2 Dashboard">
  <meta name="theme-color" content="#f8fafc">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">

  <!-- 개인 금융 정보 검색엔진 수집 차단 -->
  <meta name="robots" content="noindex, nofollow">

  <!-- 1. Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. 모듈화된 커스텀 스타일시트 -->
  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-slate-100 text-slate-900 antialiased p-1 sm:p-4 min-h-screen flex justify-center items-start">

  <!-- 메인 모바일 카드 뷰 컨테이너 (라이트 테마 최적화) -->
  <div
    class="w-full max-w-md bg-white border border-slate-200/90 rounded-2xl shadow-xl overflow-hidden flex flex-col my-1 sm:my-3">

    <!-- 최상단 상태바 (연동 상태 점 & 새로고침 버튼만 심플하게 배치) -->
    <header class="bg-white border-b border-slate-200 px-3.5 py-2 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="statusDot"></span>
        <span class="text-xs font-semibold text-slate-500">실시간 연동</span>
      </div>

      <!-- 새로고침 버튼 -->
      <button onclick="window.DashboardApp.loadData()"
        class="p-1.5 rounded-lg text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition-all flex items-center gap-1"
        title="새로고침">
        <svg class="w-4 h-4" id="refreshIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
          </path>
        </svg>
      </button>
    </header>

    <!-- 대시보드 타이틀 및 총 자산 요약 헤더 -->
    <section class="px-3.5 pt-3.5 pb-2">
      <div class="flex items-center justify-between">
        <div>
          <span class="text-sm font-bold text-blue-600 tracking-wide uppercase" id="userTitleLabel">포트폴리오 Ⓙ</span>
          <h1 class="text-2xl font-black text-slate-900 flex items-center gap-1.5" id="currentAccountTitle">
            위탁
          </h1>
        </div>
        <div class="text-right">
          <div class="text-xs text-slate-500 font-medium">총 평가 자산</div>
          <div class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight font-mono" id="headerTotalAsset">
            - 원
          </div>
        </div>
      </div>
    </section>

    <!-- 계좌 선택 탭 바 (모바일 가로 스크롤) -->
    <nav class="px-3 py-2 border-b border-slate-200">
      <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5" id="accountTabsContainer">
        <!-- js/ui.js에서 동적 생성 -->
      </div>
    </nav>

    <!-- 데이터 로딩 스피너 -->
    <div id="loadingBox" class="p-12 flex flex-col items-center justify-center space-y-3">
      <div class="w-8 h-8 border-3 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs text-slate-500">Google Sheets 실시간 데이터 동기화 중...</p>
    </div>

    <!-- 대시보드 메인 콘텐츠 영역 -->
    <main id="mainContent" class="p-2.5 sm:p-3 space-y-3.5 overflow-y-auto hidden">

      <!-- 1단: 최근 12개월 총 자산 막대그래프 -->
      <article class="bg-slate-50 border border-slate-200/90 rounded-xl p-3 sm:p-3.5 shadow-xs">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-2 h-4 rounded-full bg-blue-600"></div>
            <h2 class="text-base font-bold text-slate-900">최근 12개월 총 자산</h2>
          </div>
          <span class="text-xs text-blue-600 font-bold" id="assetGrowthLabel">-</span>
        </div>
        <div class="h-36 w-full relative">
          <svg class="w-full h-full overflow-visible" id="assetBarChartSvg"></svg>
        </div>
        <div class="flex justify-between items-center text-xs text-slate-500 mt-2.5 pt-2 border-t border-slate-200">
          <span>최저: <strong class="text-slate-900 font-bold" id="assetMinVal">-</strong></span>
          <span>최고: <strong class="text-slate-900 font-bold" id="assetMaxVal">-</strong></span>
        </div>
      </article>

      <!-- 2단: 동일 기간 배당금 수령액 막대그래프 -->
      <article class="bg-slate-50 border border-slate-200/90 rounded-xl p-3 sm:p-3.5 shadow-xs">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-2 h-4 rounded-full bg-amber-500"></div>
            <h2 class="text-base font-bold text-slate-900">동일 기간 배당금 수령액</h2>
          </div>
          <span class="text-xs font-bold text-amber-600" id="latestDividendLabel">-</span>
        </div>
        <div class="h-28 w-full relative">
          <svg class="w-full h-full overflow-visible" id="dividendBarChartSvg"></svg>
        </div>
        <div class="flex justify-between items-center text-xs text-slate-500 mt-2.5 pt-2 border-t border-slate-200">
          <span>연간 누적 배당: <strong class="text-amber-600 font-bold" id="totalDividendYear">-</strong></span>
          <span>월평균: <strong class="text-slate-900 font-bold" id="avgDividendMonth">-</strong></span>
        </div>
      </article>

      <!-- 3단: 보유 종목 비율 트리맵 (Treemap) -->
      <article class="bg-slate-50 border border-slate-200/90 rounded-xl p-3 sm:p-3.5 shadow-xs">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-2 h-4 rounded-full bg-indigo-600"></div>
            <h2 class="text-base font-bold text-slate-900">보유 종목 비율 (트리맵)</h2>
          </div>
          <span class="text-xs font-semibold text-slate-500" id="stockCountBadge">0개 종목</span>
        </div>

        <!-- 트리맵 인터랙티브 영역 -->
        <div class="w-full h-56 relative overflow-hidden bg-slate-200/60 border border-slate-200 rounded-lg select-none"
          id="ratioTreemapContainer">
        </div>

        <!-- 안내 캡션 -->
        <div class="flex items-center justify-between text-[11px] text-slate-500 mt-2 px-0.5">
          <span>💡 타일 터치 시 하단 종목 카드로 이동</span>
          <span class="text-indigo-600 font-semibold">면적 = 평가액 비중</span>
        </div>
      </article>

      <!-- 4단: 보유 종목 상세 리스트 카드 -->
      <article class="bg-slate-50 border border-slate-200/90 rounded-xl p-3 sm:p-3.5 shadow-xs">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-2 h-4 rounded-full bg-emerald-600"></div>
            <h2 class="text-base font-bold text-slate-900">보유 종목 상세 리스트</h2>
          </div>
        </div>

        <div class="space-y-2" id="stockListContainer">
        </div>
      </article>

    </main>

    <!-- 하단 푸터 -->
    <footer
      class="bg-slate-50 border-t border-slate-200 px-4 py-2.5 text-center text-xs text-slate-500 flex justify-between items-center">
      <span id="lastUpdatedTime">실시간 연동</span>
      <span class="font-medium text-slate-700">Google Sheets SPI2</span>
    </footer>

  </div>

  <!-- 3. 모듈화된 자바스크립트 로드 순서 -->
  <script src="./js/api.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
</body>

</html>
